<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>James &amp; Claudia — 21st November 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FAF7F2;
    --ivory-deep:#F3EEE5;
    --ink:#2B2440;
    --ink-soft:#564C72;
    --teal:#0E4F4F;
    --teal-light:#3E7C7A;
    --turquoise:#2FA8A6;
    --lavender:#A48FC7;
    --lavender-pale:#EFE8F8;
    --gold:#C9A227;
    --gold-light:#E4C464;
    --ribbon: linear-gradient(90deg, var(--gold), var(--lavender), var(--teal), var(--turquoise));
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:var(--ivory);
    color:var(--ink);
    font-family:'Jost', sans-serif;
    font-weight:400;
    line-height:1.6;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  h1,h2,h3{ font-family:'Playfair Display', serif; margin:0; color:var(--ink); }
  .script{ font-family:'Alex Brush', cursive; }

  a{ color:inherit; }

  .eyebrow{
    font-family:'Jost', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.28em;
    font-size:0.72rem;
    font-weight:500;
    color:var(--teal);
  }

  /* Ribbon progress bar — the site's signature: the four colors thread together as the page is read */
  #ribbon-progress{
    position:fixed; top:0; left:0; height:3px; width:0%;
    background:var(--ribbon);
    z-index:9999;
    transition:width 0.08s linear;
  }

  .ribbon-rule{
    height:3px; width:64px; margin:22px auto; border-radius:2px;
    background:var(--ribbon);
  }

  /* NAV */
  nav.site-nav{
    position:fixed; top:0; left:0; right:0; z-index:500;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 6vw;
    background:transparent;
    transition:background 0.4s ease, padding 0.4s ease, box-shadow 0.4s ease;
  }
  nav.site-nav.scrolled{
    background:rgba(250,247,242,0.92);
    backdrop-filter:blur(6px);
    padding:12px 6vw;
    box-shadow:0 2px 18px rgba(43,36,64,0.06);
  }
  .nav-mono{
    font-family:'Playfair Display', serif; font-weight:600; font-size:1.25rem;
    color:var(--ivory); letter-spacing:0.02em;
    transition:color 0.4s ease;
  }
  nav.site-nav.scrolled .nav-mono{ color:var(--ink); }
  .nav-links{ display:flex; gap:2.2rem; list-style:none; margin:0; padding:0; }
  .nav-links a{
    text-decoration:none; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.16em;
    color:var(--ivory); opacity:0.9; padding-bottom:4px; border-bottom:1px solid transparent;
    transition:color 0.4s ease, border-color 0.25s ease;
  }
  nav.site-nav.scrolled .nav-links a{ color:var(--ink-soft); }
  .nav-links a:hover, .nav-links a:focus-visible{ border-color:var(--gold); color:var(--gold); }
  .nav-toggle{ display:none; }
  @media (max-width:820px){
    .nav-links{
      position:fixed; inset:0 0 0 auto; width:70vw; max-width:320px; height:100vh;
      background:var(--ivory); flex-direction:column; justify-content:center; align-items:flex-start;
      padding:2rem 2.4rem; gap:1.6rem; transform:translateX(100%); transition:transform 0.35s ease;
      box-shadow:-10px 0 30px rgba(43,36,64,0.12);
    }
    .nav-links.open{ transform:translateX(0); }
    .nav-links a{ color:var(--ink) !important; font-size:0.9rem; }
    .nav-toggle{
      display:flex; flex-direction:column; gap:5px; background:none; border:none; cursor:pointer; z-index:600;
      padding:8px;
    }
    .nav-toggle span{ width:24px; height:2px; background:var(--ivory); transition:background 0.4s ease; }
    nav.site-nav.scrolled .nav-toggle span{ background:var(--ink); }
    .nav-toggle.open span{ background:var(--ink) !important; }
  }

  section{ padding:7rem 6vw; position:relative; }
  @media (max-width:820px){ section{ padding:5rem 6vw; } }
