<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>James & Claudia — 21st November 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:wght@500;700&family=Jost:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Jost', sans-serif;
            background: #FAF7F2;
            color: #2B2440;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .container {
            max-width: 700px;
        }
        .ribbon {
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #C9A227, #A48FC7, #0E4F4F, #2FA8A6);
            margin: 0 auto 30px;
            border-radius: 4px;
        }
        .eyebrow {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: #0E4F4F;
            font-weight: 500;
        }
        h1 {
            font-family: 'Alex Brush', cursive;
            font-size: 4rem;
            font-weight: 400;
            color: #2B2440;
            margin: 10px 0 5px;
        }
        .date {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 500;
            color: #564C72;
            margin: 10px 0 20px;
        }
        .sub {
            font-size: 1rem;
            color: #564C72;
            line-height: 1.8;
            max-width: 400px;
            margin: 0 auto;
        }
        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 44px;
            background: #0E4F4F;
            color: #fff;
            text-decoration: none;
            border-radius: 40px;
            font-weight: 500;
            letter-spacing: 0.05em;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #3E7C7A;
        }
        @media (max-width: 600px) {
            h1 { font-size: 2.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="ribbon"></div>
        <p class="eyebrow">Save the Date</p>
        <h1>James &amp; Claudia</h1>
        <p class="date">21st November 2026</p>
        <p class="sub">We can't wait to celebrate our special day with you.</p>
        <a href="#" class="btn">RSVP</a>
    </div>
</body>
</html>
