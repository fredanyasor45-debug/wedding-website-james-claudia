<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>James & Claudia - 21st November 2026</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* ===== CSS VARIABLES ===== */
        :root {
            --ivory: #FAF7F2;
            --ivory-deep: #F3EEE5;
            --ink: #282440;
            --ink-soft: #564C72;
            --teal: #0E4F4F;
            --teal-light: #3E7C7A;
            --gold: #C9A227;
            --gold-light: #E4C464;
            --lavender: #A48FC7;
            --lavender-pale: #EFE8F8;
        }

        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--ivory);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===== MAIN CONTAINER ===== */
        .invitation {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 60px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(40, 36, 64, 0.10);
            text-align: center;
        }

        /* ===== TYPOGRAPHY ===== */
        .subtitle {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            font-size: 1.1rem;
            letter-spacing: 4px;
            color: var(--teal);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .names {
            font-family: 'Alex Brush', cursive;
            font-size: 4.2rem;
            color: var(--ink);
            line-height: 1.1;
            margin: 10px 0 8px 0;
        }

        .ampersand {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: var(--gold);
            display: inline-block;
            margin: 0 8px;
        }

        .date {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 500;
            color: var(--ink-soft);
            margin-top: 16px;
            letter-spacing: 2px;
        }

        .details {
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: 1rem;
            color: var(--ink-soft);
            line-height: 1.8;
            margin-top: 24px;
            letter-spacing: 0.5px;
        }

        .details strong {
            font-weight: 600;
            color: var(--teal);
        }

        /* ===== DIVIDER ===== */
        .divider {
            width: 60px;
            height: 2px;
            background: var(--gold-light);
            margin: 28px auto;
        }

        /* ===== RSVP BUTTON ===== */
        .btn-rsvp {
            display: inline-block;
            background: var(--teal);
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 14px 48px;
            border-radius: 50px;
            text-decoration: none;
            transition: background 0.3s ease, transform 0.2s ease;
            margin-top: 12px;
        }

        .btn-rsvp:hover {
            background: var(--teal-light);
            transform: scale(1.02);
        }

        /* ===== FOOTER ===== */
        .footer-note {
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: 0.8rem;
            color: var(--ink-soft);
            margin-top: 40px;
            letter-spacing: 1px;
            opacity: 0.7;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .invitation {
                padding: 40px 24px;
            }
            .names {
                font-size: 2.8rem;
            }
            .ampersand {
                font-size: 2rem;
            }
            .date {
                font-size: 1.2rem;
            }
            .subtitle {
                font-size: 0.8rem;
                letter-spacing: 3px;
            }
            .btn-rsvp {
                padding: 12px 32px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="invitation">
        <!-- SUBTITLE -->
        <p class="subtitle">We invite you to celebrate</p>

        <!-- NAMES -->
        <h1 class="names">
            James
            <span class="ampersand">&amp;</span>
            Claudia
        </h1>

        <!-- DIVIDER -->
        <div class="divider"></div>

        <!-- DATE -->
        <p class="date">21st November 2026</p>

        <!-- DETAILS -->
        <p class="details">
            <strong>Ceremony</strong> · 4:00 PM<br>
            St. Margaret's Chapel · Edinburgh, Scotland<br><br>
            <strong>Reception</strong> · 6:00 PM<br>
            The Signet Library · Edinburgh
        </p>

        <!-- RSVP BUTTON -->
        <a href="#" class="btn-rsvp">RSVP</a>

        <!-- FOOTER -->
        <p class="footer-note">Dress code · Black Tie</p>
    </div>

</body>
</html>
